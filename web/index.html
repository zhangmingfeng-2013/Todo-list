<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>cpp-todo · 本机待办</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- SVG 图标精灵 -->
<svg style="display:none">
  <symbol id="icon-today" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></symbol>
  <symbol id="icon-projects" viewBox="0 0 16 16"><path d="M3 5h10M3 8h10M3 11h10"/></symbol>
  <symbol id="icon-tags" viewBox="0 0 16 16"><path d="M4 3h5l5 5-5 5-5-5z"/></symbol>
  <symbol id="icon-calendar" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="1"/><path d="M2 7h12M5 2v3M11 2v3"/></symbol>
  <symbol id="icon-kanban" viewBox="0 0 16 16"><rect x="2" y="3" width="3" height="10" rx="1"/><rect x="6.5" y="3" width="3" height="10" rx="1"/><rect x="11" y="3" width="3" height="10" rx="1"/></symbol>
  <symbol id="icon-filters" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="M13 13l-3-3"/></symbol>
  <symbol id="icon-stats" viewBox="0 0 16 16"><rect x="2" y="10" width="3" height="4"/><rect x="6.5" y="6" width="3" height="8"/><rect x="11" y="2" width="3" height="12"/></symbol>
  <symbol id="icon-gantt" viewBox="0 0 16 16"><path d="M2 5h6M2 9h10M2 13h4"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 16 16"><path d="M3 5h10M5 5V3h6v2M6 8v5M10 8v5"/></symbol>
  <symbol id="icon-pomodoro" viewBox="0 0 16 16"><circle cx="8" cy="9" r="5"/><path d="M8 4V2M6 4L5 2M10 4l1-2"/></symbol>
  <symbol id="icon-bolt" viewBox="0 0 16 16"><path d="M9 1L4 8h3.2L6 15l6-8H8.8z"/></symbol>
  <symbol id="icon-cmd" viewBox="0 0 16 16"><path d="M9 2L5 9h4l-1 5 5-7H9z"/></symbol>
  <symbol id="icon-export" viewBox="0 0 16 16"><path d="M8 2v8M5 6l3-3 3 3M3 11h10"/></symbol>
  <symbol id="icon-theme" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M4 4l1.5 1.5M11 11l1.5 1.5M4 12l1.5-1.5M11 5l1.5-1.5"/></symbol>
  <symbol id="icon-import" viewBox="0 0 16 16"><path d="M8 14V6M5 9l3 3 3-3M3 4h10"/></symbol>
  <symbol id="icon-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
  <symbol id="icon-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4"/><path d="M13 13l-3-3"/></symbol>
  <symbol id="icon-check" viewBox="0 0 16 16"><path d="M3 8l3 3 7-7"/></symbol>
  <symbol id="icon-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
  <symbol id="icon-day" viewBox="0 0 16 16"><path d="M2 3.5h12M2 8h12M2 12.5h12"/><circle cx="6" cy="8" r="1.8"/><circle cx="11" cy="12.5" r="1.8"/></symbol>
  <symbol id="icon-undo" viewBox="0 0 16 16"><path d="M3 7h7a3.5 3.5 0 010 7H6"/><path d="M6 4L3 7l3 3"/></symbol>
  <symbol id="icon-focus" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.5"/></symbol>
  <symbol id="icon-sync" viewBox="0 0 16 16"><path d="M13 6a5 5 0 00-9-1M3 10a5 5 0 009 1"/><path d="M13 2v4h-4M3 14v-4h4"/></symbol>
  <symbol id="icon-journal" viewBox="0 0 16 16"><path d="M3 2.5h8.5a1.5 1.5 0 011.5 1.5v10H4.5A1.5 1.5 0 013 12.5v-10z"/><path d="M3 12.5A1.5 1.5 0 014.5 11H13"/><path d="M6 5.5h4M6 8h3"/></symbol>
  <symbol id="icon-tired" viewBox="0 0 16 16"><path d="M13.5 9.5A6 6 0 118 2.5a4.75 4.75 0 005.5 7z"/><path d="M10.5 3h.01M12.5 5h.01M11 7h.01"/></symbol>
  <symbol id="icon-relief" viewBox="0 0 16 16"><path d="M8 2l1.8 3.6L13.5 6.2l-2.7 2.7.6 3.8L8 10.8 4.6 12.7l.6-3.8L2.5 6.2l3.7-.6z"/></symbol>
  <symbol id="icon-ai" viewBox="0 0 16 16"><path d="M8 1.5l1.6 4.4 4.4 1.6-4.4 1.6L8 13.5l-1.6-4.4L2 7.5l4.4-1.6z"/><circle cx="13.5" cy="2.5" r="0.7"/><circle cx="2.5" cy="13.5" r="0.7"/></symbol>
</svg>

<div id="app">
  <!-- ============ 侧边栏 ============ -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">✓</div>
      <div class="brand-text">
        <h1>cpp-todo</h1>
        <p id="lunar-today">农历…</p>
      </div>
    </div>

    <nav id="view-nav">
      <button data-view="today" class="nav-item active" title="今日面板">
        <span class="nav-ico"><svg><use href="#icon-today"/></svg></span>今日
      </button>
      <button data-view="projects" class="nav-item" title="项目视图">
        <span class="nav-ico"><svg><use href="#icon-projects"/></svg></span>项目
      </button>
      <button data-view="tags" class="nav-item" title="标签筛选">
        <span class="nav-ico"><svg><use href="#icon-tags"/></svg></span>标签
      </button>
      <button data-view="calendar" class="nav-item" title="日历视图">
        <span class="nav-ico"><svg><use href="#icon-calendar"/></svg></span>日历
      </button>
      <button data-view="day" class="nav-item" title="时间块日视图（D）">
        <span class="nav-ico"><svg><use href="#icon-day"/></svg></span>日视图
      </button>
      <button data-view="kanban" class="nav-item" title="看板视图">
        <span class="nav-ico"><svg><use href="#icon-kanban"/></svg></span>看板
      </button>
      <button data-view="filters" class="nav-item" title="保存的筛选">
        <span class="nav-ico"><svg><use href="#icon-filters"/></svg></span>筛选
      </button>
      <button data-view="stats" class="nav-item" title="统计仪表盘">
        <span class="nav-ico"><svg><use href="#icon-stats"/></svg></span>统计
      </button>
      <button data-view="journal" class="nav-item" title="情绪日记 · 成就感日志与放下的事">
        <span class="nav-ico"><svg><use href="#icon-journal"/></svg></span>日记
      </button>
      <button data-view="gantt" class="nav-item" title="甘特 / 依赖图">
        <span class="nav-ico"><svg><use href="#icon-gantt"/></svg></span>甘特图
      </button>
      <button data-view="trash" class="nav-item" title="回收站（30 天自动清理）">
        <span class="nav-ico"><svg><use href="#icon-trash"/></svg></span>回收站
      </button>
      <button data-view="ai" class="nav-item" title="AI 智能助手（本地模型 · 全离线 · 隐私闭环）">
        <span class="nav-ico"><svg><use href="#icon-ai"/></svg></span>AI 助手
      </button>
      <button data-act="open-pomo" class="nav-item" title="打开番茄钟（P）">
        <span class="nav-ico"><svg><use href="#icon-pomodoro"/></svg></span>番茄钟
      </button>
    </nav>

    <div class="side-section">
      <h3>项目 <button id="btn-add-project" class="mini-btn" title="新建项目">＋</button></h3>
      <div id="project-tree"></div>
    </div>

    <div class="side-section">
      <h3>标签</h3>
      <div id="tag-cloud"></div>
    </div>

    <div class="sidebar-foot">
      <button id="btn-storage" class="storage-btn" title="选择存储位置（可迁移到 U盘）">
        <span>💾 存储位置</span>
        <small>零账号 · 数据仅存本机</small>
      </button>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <main id="main">
    <header id="topbar">
      <div class="quick-wrap" title="自然语言快速录入：明天下午3点 写周报 #工作 !高 /项目名">
        <span class="quick-ico"><svg><use href="#icon-bolt"/></svg></span>
        <input id="quick-input" type="text" placeholder="快速录入：明天下午3点 写周报 #工作 !高" autocomplete="off">
      </div>
      <div class="search-wrap">
        <span class="search-ico"><svg><use href="#icon-search"/></svg></span>
        <input id="search-input" type="text" placeholder="搜索任务（标题 / 备注）…" autocomplete="off">
        <div id="search-drop" class="hidden"></div>
      </div>
      <div class="top-actions">
        <button id="btn-tired" class="btn btn-tired" title="疲惫模式：状态不好时只看 5 分钟小任务，降低心理门槛"><span class="btn-ico"><svg><use href="#icon-tired"/></svg></span>疲惫模式</button>
        <button id="btn-palette" class="btn" title="命令面板（⌘K / Ctrl+K）"><span class="btn-ico"><svg><use href="#icon-cmd"/></svg></span>命令面板</button>
        <button id="btn-export" class="btn" title="导出 Todo.txt / JSON / CSV"><span class="btn-ico"><svg><use href="#icon-export"/></svg></span>导出</button>
        <button id="btn-theme" class="btn" title="切换深色模式（T）"><span class="btn-ico"><svg><use href="#icon-theme"/></svg></span>主题</button>
        <button id="btn-import" class="btn" title="从滴答 / Todoist / Todo.txt 导入"><span class="btn-ico"><svg><use href="#icon-import"/></svg></span>导入</button>
        <button id="btn-new" class="btn btn-primary"><span class="btn-ico"><svg><use href="#icon-plus"/></svg></span>新建任务</button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>

<!-- 模态框根节点 -->
<div id="modal-root"></div>
<!-- 轻提示根节点 -->
<div id="toast-root"></div>
<!-- 番茄钟挂件 -->
<div id="pomo-widget" class="hidden">
  <div id="pomo-header">
    <span id="pomo-task-name"><svg class="btn-ico" style="vertical-align:-3px"><use href="#icon-pomodoro"/></svg> 番茄钟</span>
    <button id="pomo-close" title="收起"><svg width="12" height="12"><use href="#icon-close"/></svg></button>
  </div>
  <div id="pomo-body">
    <div id="pomo-timer">25:00</div>
    <div id="pomo-controls">
      <select id="pomo-task-select"><option value="0">（不关联任务）</option></select>
    </div>
    <div id="pomo-btns">
      <button id="pomo-start" class="btn btn-sm btn-primary">开始</button>
      <button id="pomo-reset" class="btn btn-sm">重置</button>
    </div>
  </div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="app.js"></script>
</body>
</html>
